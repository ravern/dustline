name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy and check health
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_GIT_REMOTE: ${{ secrets.DEPLOY_GIT_REMOTE }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_GIT_REMOTE DEPLOY_HEALTH_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

          deploy_dir=$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXX")
          trap 'rm -rf "$deploy_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $deploy_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$deploy_dir/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"

          # Server output can include private infrastructure details. Keep it out of public logs.
          if ! git push "$DEPLOY_GIT_REMOTE" HEAD:refs/heads/main > "$deploy_dir/push.log" 2>&1; then
            echo '::error::Deployment failed. Inspect the deployment logs on the server.'
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 "$DEPLOY_HEALTH_URL" > "$deploy_dir/health.json" 2> "$deploy_dir/health.log"; then
            echo '::error::The deployed application did not pass its health check.'
            exit 1
          fi
          if ! node -e 'try { if (JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).ok !== true) process.exit(1); } catch { process.exit(1); }' "$deploy_dir/health.json"; then
            echo '::error::The deployed application reported an unhealthy status.'
            exit 1
          fi
          echo 'Deployment and health check succeeded.'
